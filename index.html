<style>
/* ═══════════════════════════════════════════════════════════
   Alaa Shahin — holding page
   Built to the approved brand pack: wine opens, navy closes,
   paper ground, one gold element, graph-paper texture only.
   ═══════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  /* wine */
  --wine:#702F44; --wine-hover:#843A53; --wine-pressed:#5A2536; --wine-tint:#F4E9EC;
  /* navy */
  --navy:#1B3656; --navy-600:#24466F; --navy-900:#0F2136; --navy-tint:#E8ECF2;
  /* paper */
  --paper:#F7F3EE; --paper-2:#EFE9E1; --white:#FFFFFF;
  /* ink */
  --ink:#1B3656; --ink-2:#4A5A6E; --ink-3:#6B7684;
  /* gold — exactly one element per design */
  --gold:#B8893B; --gold-light:#D4A853; --gold-ink:#8A6420;
  /* non-text detail only */
  --grey:#8B8B8B;

  --f-ar:'El Messiri','IBM Plex Sans',sans-serif;
  --f-la:'IBM Plex Sans',system-ui,-apple-system,sans-serif;

  /* radii derived from the logo */
  --r-field:14px; --r-card:20px; --r-modal:28px; --r-hero:36px; --r-pill:999px;

  --ease:cubic-bezier(.2,.8,.2,1);
}

html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--f-la);
  font-size:17px; font-weight:300; line-height:1.7;
  background:var(--wine); color:var(--paper);
  min-height:100dvh; display:flex; flex-direction:column;
  -webkit-font-smoothing:antialiased;
}
[dir="rtl"] body{font-family:var(--f-ar);font-weight:400;line-height:1.8}
body.is-swapping{opacity:0}
body{transition:opacity .18s var(--ease)}

/* graph paper — the only texture, on cover areas */
.cover{
  position:relative; flex:1;
  display:flex; flex-direction:column;
  padding:clamp(1.5rem,4vw,3rem) clamp(1.25rem,5vw,4rem);
  overflow:hidden;
}
.cover::before{
  content:''; position:absolute; inset:0; pointer-events:none;
  background-image:
    linear-gradient(rgba(247,243,238,.08) 1px,transparent 1px),
    linear-gradient(90deg,rgba(247,243,238,.08) 1px,transparent 1px);
  background-size:48px 48px;
  mask-image:radial-gradient(115% 80% at 50% 0%,#000 25%,transparent 80%);
  -webkit-mask-image:radial-gradient(115% 80% at 50% 0%,#000 25%,transparent 80%);
}
.cover > *{position:relative;z-index:1}

/* ── top bar ───────────────────────────────────────────── */
.bar{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.mark{display:inline-flex;align-items:center;gap:.6rem;font-family:var(--f-la);font-size:.95rem;letter-spacing:.02em;color:rgba(247,243,238,.85)}
[dir="rtl"] .mark{font-family:var(--f-ar);letter-spacing:0}
/* nuqta — rounded square turned 45°, the pack's bullet/mark shape */
.nuqta{width:11px;height:11px;border-radius:3px;background:var(--paper);transform:rotate(45deg);flex-shrink:0}

.lang{
  font:inherit;font-size:.9rem;font-weight:400;
  background:transparent;color:rgba(247,243,238,.85);
  border:1px solid rgba(247,243,238,.3);border-radius:var(--r-pill);
  padding:.45rem 1.05rem;cursor:pointer;
  transition:background-color .25s var(--ease),border-color .25s var(--ease),color .25s var(--ease);
}
.lang:hover,.lang:focus-visible{background:var(--paper);border-color:var(--paper);color:var(--wine)}

/* ── centre ────────────────────────────────────────────── */
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
     max-width:44rem;margin-inline:auto;margin-block:clamp(2.5rem,7vw,5rem)}
.mid .head,.mid .sub{margin-inline:auto}

.eyebrow{display:inline-flex;align-items:center;gap:.6rem;font-size:.95rem;font-weight:400;color:rgba(247,243,238,.72)}
.eyebrow .sep{color:rgba(247,243,238,.45)}  /* gold is spent on .rule — one gold element per design */

/* the name is the largest text in the first impression, weight 500 */
.name{
  font-family:var(--f-la);font-weight:500;
  font-size:clamp(2.75rem,1.6rem+5.2vw,4.5rem);
  line-height:1.1;letter-spacing:-.015em;color:var(--paper);
  margin-top:clamp(1rem,2.5vw,1.5rem);
}
[dir="rtl"] .name{font-family:var(--f-ar);letter-spacing:0;line-height:1.3;font-weight:500}

/* the single gold element */
.rule{width:64px;height:2px;background:var(--gold-light);border:0;margin:clamp(1.5rem,3vw,2rem) auto 0;border-radius:2px}

.head{
  font-family:var(--f-la);font-weight:300;
  font-size:clamp(1.35rem,1.1rem+1.2vw,1.95rem);
  line-height:1.35;color:var(--paper);margin-top:clamp(1.5rem,3vw,2rem);max-width:22ch;
}
[dir="rtl"] .head{font-family:var(--f-ar);font-weight:400;line-height:1.55}

.sub{font-size:17px;color:rgba(247,243,238,.78);margin-top:1rem;max-width:40ch}

.acts{display:flex;flex-wrap:wrap;justify-content:center;gap:.75rem;margin-top:clamp(2rem,4vw,2.75rem)}
.btn{
  display:inline-flex;align-items:center;gap:.65rem;
  padding:.85rem 1.6rem;border-radius:var(--r-pill);
  font:inherit;font-size:1rem;font-weight:400;
  background:var(--paper);color:var(--wine);border:1px solid var(--paper);
  text-decoration:none;
  transition:transform .25s var(--ease),background-color .25s var(--ease),color .25s var(--ease),border-color .25s var(--ease);
}
.btn:hover,.btn:focus-visible{transform:translateY(-2px)}
.btn--ghost{background:transparent;color:var(--paper);border-color:rgba(247,243,238,.35)}
.btn--ghost:hover,.btn--ghost:focus-visible{border-color:var(--paper);background:rgba(247,243,238,.08);color:var(--paper)}
.btn svg{flex-shrink:0}
[dir="rtl"] .btn svg{transform:scaleX(-1)}

/* ── navy closes ───────────────────────────────────────── */
.close{
  background:var(--navy);color:rgba(247,243,238,.72);
  padding:clamp(1.5rem,3.5vw,2.25rem) clamp(1.25rem,5vw,4rem);
}
.close__in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1rem 1.5rem;max-width:1200px;margin-inline:auto;width:100%}
.contact{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1rem;font-size:.95rem}
.contact a{color:var(--paper);text-decoration:none;border-bottom:1px solid rgba(247,243,238,.3);padding-bottom:1px;transition:border-color .25s var(--ease)}
.contact a:hover{border-color:var(--paper)}
.dot{color:var(--grey)}

.social{display:flex;gap:.5rem}
.social a{
  width:38px;height:38px;display:grid;place-items:center;border-radius:50%;
  background:rgba(247,243,238,.08);color:rgba(247,243,238,.8);
  transition:background-color .25s var(--ease),color .25s var(--ease),transform .25s var(--ease);
}
.social a:hover{background:var(--paper);color:var(--navy);transform:translateY(-2px)}

:focus-visible{outline:2px solid var(--gold-light);outline-offset:3px;border-radius:var(--r-field)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.001ms!important;animation-duration:.001ms!important}
}
</style>
</head>
<body>

<main class="cover">
  <div class="bar">
    <span class="mark">
      <span class="nuqta" aria-hidden="true"></span>
      <span data-ar="آلاء شاهين">Alaa Shahin</span>
    </span>
    <button class="lang" type="button" id="lang" aria-label="Switch language">
      <span id="langLabel">عربي</span>
    </button>
  </div>

  <div class="mid">
    <p class="eyebrow" data-ar="تجربة المستخدم <span class='sep'>·</span> البحث <span class='sep'>·</span> التعليم">Experience design <span class="sep">·</span> Research <span class="sep">·</span> Teaching</p>

    <h1 class="name" data-ar="آلاء شاهين">Alaa Shahin</h1>

    <hr class="rule" aria-hidden="true">

    <p class="head" data-ar="الموقع الجديد عم يتجهّز.">A new site is on the way.</p>

    <p class="sub" data-ar="لسّا عم اشتغل عليه. لحتى يخلص، التواصل مفتوح وحجز الجلسات شغّال.">Still being built. Until it is ready, enquiries are open and sessions can be booked as usual.</p>

    <div class="acts">
      <a class="btn" href="https://calendar.app.google/dumF27oX3baRqBdA6" target="_blank" rel="noopener">
        <span data-ar="حجز جلسة">Book a session</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M12 5l7 7-7 7"/></svg>
      </a>
      <a class="btn btn--ghost" href="mailto:contact@alaashahin.com">
        <span data-ar="مراسلة عبر البريد">Send an email</span>
      </a>
    </div>
  </div>
</main>

<footer class="close">
  <div class="close__in">
    <p class="contact">
      <span data-ar="للتواصل">Get in touch</span>
      <span class="dot" aria-hidden="true">·</span>
      <a href="mailto:contact@alaashahin.com">contact@alaashahin.com</a>
    </p>
    <div class="social">
      <a href="https://www.linkedin.com/in/thealaashahin/" target="_blank" rel="noopener" aria-label="LinkedIn"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4.98 3.5A2.5 2.5 0 1 1 0 3.5a2.5 2.5 0 0 1 4.98 0zM.4 8.4h4.2V24H.4zM8.3 8.4h4v2.13h.06c.56-1.06 1.93-2.18 3.97-2.18 4.25 0 5.03 2.8 5.03 6.43V24h-4.19v-7.36c0-1.76-.03-4.02-2.45-4.02-2.45 0-2.83 1.92-2.83 3.9V24H8.3z"/></svg></a>
      <a href="https://www.instagram.com/thealaashahin/" target="_blank" rel="noopener" aria-label="Instagram"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><rect x="2.6" y="2.6" width="18.8" height="18.8" rx="5.2"/><circle cx="12" cy="12" r="4.1"/><circle cx="17.6" cy="6.4" r="1.15" fill="currentColor" stroke="none"/></svg></a>
      <a href="https://www.youtube.com/@TheAlaaShahin" target="_blank" rel="noopener" aria-label="YouTube"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M23.5 6.9a3 3 0 0 0-2.1-2.1C19.5 4.3 12 4.3 12 4.3s-7.5 0-9.4.5A3 3 0 0 0 .5 6.9C0 8.8 0 12 0 12s0 3.2.5 5.1a3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1C24 15.2 24 12 24 12s0-3.2-.5-5.1zM9.6 15.6V8.4l6.2 3.6z"/></svg></a>
      <a href="https://www.tiktok.com/@thealaashahin" target="_blank" rel="noopener" aria-label="TikTok"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.6 5.82A4.28 4.28 0 0 1 15.54 3h-3.09v12.4a2.59 2.59 0 1 1-1.83-2.48V9.77a5.68 5.68 0 1 0 4.92 5.63V9.01a7.35 7.35 0 0 0 4.3 1.38V7.3a4.28 4.28 0 0 1-3.24-1.48z"/></svg></a>
    </div>
  </div>
</footer>

<script>
/* English lives in the markup so the page is correct and indexable with
   JavaScript off; Arabic rides along in data-ar. */
(function(){
  var root=document.documentElement, body=document.body;
  var btn=document.getElementById('lang'), label=document.getElementById('langLabel');

  function apply(l){
    var nodes=document.querySelectorAll('[data-ar]');
    for(var i=0;i<nodes.length;i++){
      var el=nodes[i];
      if(el.dataset.en===undefined) el.dataset.en=el.innerHTML;
      el.innerHTML=(l==='ar')?el.dataset.ar:el.dataset.en;
    }
    root.lang=l; root.dir=(l==='ar')?'rtl':'ltr';
    label.textContent=(l==='ar')?'English':'عربي';
    document.title=(l==='ar')?'آلاء شاهين — الموقع الجديد عم يتجهّز':'Alaa Shahin — A new site is on the way';
  }
  function current(){ try{ return localStorage.getItem('as-lang')||'en'; }catch(e){ return 'en'; } }

  btn.addEventListener('click',function(){
    var next=current()==='ar'?'en':'ar';
    try{ localStorage.setItem('as-lang',next); }catch(e){}
    body.classList.add('is-swapping');
    setTimeout(function(){ apply(next); body.classList.remove('is-swapping'); },160);
  });

  apply(current());
})();
</script>
</body>
