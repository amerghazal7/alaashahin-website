<style>
/* ═══════════════════════════════════════════════════════════
   Alaa Shahin — holding page
   Paper ground, navy as the voice, wine for the one highlight,
   the arrow and the pill. Graph paper is the only texture.
   ═══════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --wine:#702F44; --wine-hover:#843A53; --wine-pressed:#5A2536; --wine-tint:#F4E9EC;
  --navy:#1B3656; --navy-600:#24466F; --navy-900:#0F2136; --navy-tint:#E8ECF2;
  --paper:#F7F3EE; --paper-2:#EFE9E1; --white:#FFFFFF;
  --ink:#1B3656; --ink-2:#4A5A6E; --ink-3:#6B7684;
  --grey:#8B8B8B;

  --f-ar:'El Messiri','IBM Plex Sans',sans-serif;
  --f-la:'IBM Plex Sans',system-ui,-apple-system,sans-serif;

  --r-field:14px; --r-card:20px; --r-pill:999px;
  --ease:cubic-bezier(.2,.8,.2,1);
}

html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--f-la);
  font-size:17px;font-weight:300;line-height:1.7;
  background:var(--paper);color:var(--ink-2);
  min-height:100dvh;display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;
}
[dir="rtl"] body{font-family:var(--f-ar);font-weight:400;line-height:1.8}
body{transition:opacity .18s var(--ease)}
body.is-swapping{opacity:0}

/* graph paper — the only texture, navy on paper */
.cover{
  position:relative;flex:1;display:flex;flex-direction:column;
  padding:clamp(1.5rem,4vw,3rem) clamp(1.25rem,5vw,4rem);
  overflow:hidden;
}
.cover::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(27,54,86,.10) 1px,transparent 1px),
    linear-gradient(90deg,rgba(27,54,86,.10) 1px,transparent 1px);
  background-size:46px 46px;
  mask-image:radial-gradient(120% 95% at 50% 40%,#000 35%,transparent 88%);
  -webkit-mask-image:radial-gradient(120% 95% at 50% 40%,#000 35%,transparent 88%);
}
.cover>*{position:relative;z-index:1}

/* ── top bar ───────────────────────────────────────────── */
.bar{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.mark{display:inline-flex;align-items:center;gap:.6rem;font-family:var(--f-la);font-size:.95rem;font-weight:500;color:var(--navy)}
[dir="rtl"] .mark{font-family:var(--f-ar)}
.nuqta{width:11px;height:11px;border-radius:3px;background:var(--wine);transform:rotate(45deg);flex-shrink:0}

.lang{
  font:inherit;font-size:.9rem;font-weight:400;
  background:transparent;color:var(--navy);
  border:1px solid rgba(27,54,86,.25);border-radius:var(--r-pill);
  padding:.45rem 1.05rem;cursor:pointer;
  transition:background-color .25s var(--ease),border-color .25s var(--ease),color .25s var(--ease);
}
.lang:hover,.lang:focus-visible{background:var(--navy);border-color:var(--navy);color:var(--paper)}

/* ── centre ────────────────────────────────────────────── */
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;
     text-align:center;max-width:52rem;margin-inline:auto;margin-block:clamp(2.5rem,6vw,4.5rem)}


/* the line, set bold in navy with one wine highlight */
/* ── tier 1 · who ─────────────────────────────────────────
   The name carries the page. Everything else steps down from it. */
.line{
  font-family:var(--f-la);font-weight:500;
  font-size:clamp(3rem,1.5rem + 6.2vw,5.5rem);
  line-height:1.05;letter-spacing:-.028em;color:var(--navy);
  text-wrap:balance;
}
[dir="rtl"] .line{font-family:var(--f-ar);font-weight:500;letter-spacing:0;line-height:1.28}

/* tier 1b · the role is bound to the name — small, close, quiet,
   with the wine only on the separators */
.role{
  font-size:clamp(.92rem,.88rem + .2vw,1rem);font-weight:400;
  color:var(--ink-2);margin-top:.7rem;text-wrap:balance;
}
.role .sep{color:var(--wine)}

/* ── tier 2 · what is happening ───────────────────────────
   The reason the page exists, so it reads as a statement, not a note. */
.msg{
  font-family:var(--f-la);font-weight:400;
  font-size:clamp(1.3rem,1.08rem + 1.05vw,1.8rem);
  line-height:1.3;letter-spacing:-.012em;color:var(--navy);
  margin-top:clamp(2.75rem,6vw,4.25rem);
}
[dir="rtl"] .msg{font-family:var(--f-ar);letter-spacing:0;line-height:1.5}

/* tier 3 · the detail under it */
.sub{font-size:1rem;color:var(--ink-2);margin-top:.65rem;max-width:44ch;margin-inline:auto;text-wrap:balance}

/* ── the action, with the drawn arrow leaning into it ──── */
.act{position:relative;display:inline-flex;align-items:center;margin-top:clamp(1.75rem,3.5vw,2.4rem)}
/* Tail starts up at the copy, curves over and the head comes down into
   the button — so it sits before the button, drawn unmirrored. RTL flips
   the whole block, so the drawing mirrors with it. */
.arrow{
  position:absolute;inset-inline-end:calc(100% + .4rem);bottom:6%;
  width:clamp(62px,6.6vw,86px);height:auto;color:var(--wine);pointer-events:none;
}
[dir="rtl"] .arrow{transform:scaleX(-1)}
@media (max-width:640px){.arrow{display:none}}

.btn{
  display:inline-flex;align-items:center;gap:.65rem;
  padding:.9rem 1.75rem;border-radius:var(--r-pill);
  font:inherit;font-size:1.02rem;font-weight:500;
  background:var(--wine);color:var(--paper);border:1px solid var(--wine);
  text-decoration:none;
  transition:transform .25s var(--ease),background-color .25s var(--ease),border-color .25s var(--ease);
}
.btn:hover,.btn:focus-visible{background:var(--wine-hover);border-color:var(--wine-hover);transform:translateY(-2px)}
.btn:active{background:var(--wine-pressed);transform:translateY(0)}

/* ── follow ────────────────────────────────────────────── */
/* ── tier 4 · the quiet secondary route ──────────────────── */
.follow{display:flex;flex-direction:column;align-items:center;gap:.75rem;margin-top:clamp(3.25rem,7vw,5rem)}
.follow__k{font-size:.86rem;font-weight:400;color:var(--ink-2)}
.social{display:flex;gap:.5rem}
.social a{
  width:38px;height:38px;display:grid;place-items:center;border-radius:50%;
  background:var(--navy-tint);color:var(--navy);
  transition:background-color .25s var(--ease),color .25s var(--ease),transform .25s var(--ease);
}
.social a:hover,.social a:focus-visible{background:var(--wine);color:var(--paper);transform:translateY(-2px)}

/* ── navy closes ───────────────────────────────────────── */
.close{background:var(--navy);color:rgba(247,243,238,.7);padding:clamp(1.15rem,2.5vw,1.5rem) clamp(1.25rem,5vw,4rem);font-size:.93rem}
.close__in{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.4rem .85rem;max-width:1200px;margin-inline:auto;text-align:center}
.close a{color:var(--paper);text-decoration:none;border-bottom:1px solid rgba(247,243,238,.35);padding-bottom:1px;transition:border-color .25s var(--ease)}
.close a:hover{border-color:var(--paper)}
.dot{color:var(--grey)}

:focus-visible{outline:2px solid var(--wine);outline-offset:3px;border-radius:var(--r-field)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.001ms!important;animation-duration:.001ms!important}}
</style>
</head>
<body>

<main class="cover">
  <div class="bar">
    <span class="mark">
      <span class="nuqta" aria-hidden="true"></span>
      <span data-ar="آلاء شاهين">Alaa Shahin</span>
    </span>
    <button class="lang" type="button" id="lang" aria-label="Switch language"><span id="langLabel">عربي</span></button>
  </div>

  <div class="mid">
    <h1 class="line" data-ar="آلاء شاهين">Alaa Shahin</h1>

    <p class="role" data-ar="متخصصة تصميم تجارب <span class='sep'>·</span> مدرِّبة <span class='sep'>·</span> متحدثة">Experience Design Specialist <span class="sep">·</span> Educator <span class="sep">·</span> Speaker</p>

    <p class="msg" data-ar="الموقع الجديد قيد الإنشاء.">A new site is on the way.</p>
    <p class="sub" data-ar="وإلى حين اكتماله، يبقى البريد الإلكتروني أسرع وسيلة للتواصل.">Until it is ready, email is the quickest way to reach me.</p>

    <div class="act">
      <svg class="arrow" viewBox="0 0 120 92" fill="none" aria-hidden="true">
        <path d="M4 10c26-6 55 1 72 18 9 9 14 21 16 36" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
        <path d="M80 58c6 7 10 13 12 20 4-7 9-13 16-18" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <a class="btn" href="mailto:contact@alaashahin.com">
        <span data-ar="المراسلة عبر البريد">Send an email</span>
      </a>
    </div>

    <div class="follow">
      <p class="follow__k" data-ar="لمتابعة الأفكار">Follow the thinking</p>
      <div class="social">
        <a href="https://www.linkedin.com/in/thealaashahin/" target="_blank" rel="noopener" aria-label="LinkedIn"><svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4.98 3.5A2.5 2.5 0 1 1 0 3.5a2.5 2.5 0 0 1 4.98 0zM.4 8.4h4.2V24H.4zM8.3 8.4h4v2.13h.06c.56-1.06 1.93-2.18 3.97-2.18 4.25 0 5.03 2.8 5.03 6.43V24h-4.19v-7.36c0-1.76-.03-4.02-2.45-4.02-2.45 0-2.83 1.92-2.83 3.9V24H8.3z"/></svg></a>
        <a href="https://www.instagram.com/thealaashahin/" target="_blank" rel="noopener" aria-label="Instagram"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><rect x="2.6" y="2.6" width="18.8" height="18.8" rx="5.2"/><circle cx="12" cy="12" r="4.1"/><circle cx="17.6" cy="6.4" r="1.15" fill="currentColor" stroke="none"/></svg></a>
        <a href="https://www.youtube.com/@TheAlaaShahin" target="_blank" rel="noopener" aria-label="YouTube"><svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M23.5 6.9a3 3 0 0 0-2.1-2.1C19.5 4.3 12 4.3 12 4.3s-7.5 0-9.4.5A3 3 0 0 0 .5 6.9C0 8.8 0 12 0 12s0 3.2.5 5.1a3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1C24 15.2 24 12 24 12s0-3.2-.5-5.1zM9.6 15.6V8.4l6.2 3.6z"/></svg></a>
        <a href="https://www.tiktok.com/@thealaashahin" target="_blank" rel="noopener" aria-label="TikTok"><svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.6 5.82A4.28 4.28 0 0 1 15.54 3h-3.09v12.4a2.59 2.59 0 1 1-1.83-2.48V9.77a5.68 5.68 0 1 0 4.92 5.63V9.01a7.35 7.35 0 0 0 4.3 1.38V7.3a4.28 4.28 0 0 1-3.24-1.48z"/></svg></a>
      </div>
    </div>
  </div>
</main>

<footer class="close">
  <p class="close__in">
    <span data-ar="للتواصل">Get in touch</span>
    <span class="dot" aria-hidden="true">·</span>
    <a href="mailto:contact@alaashahin.com">contact@alaashahin.com</a>
  </p>
</footer>

<script>
/* English lives in the markup so the page is correct and indexable with
   JavaScript off; Arabic rides along in data-ar. */
(function(){
  var root=document.documentElement, body=document.body;
  var btn=document.getElementById('lang'), label=document.getElementById('langLabel');
  function apply(l){
    var n=document.querySelectorAll('[data-ar]');
    for(var i=0;i<n.length;i++){
      var el=n[i];
      if(el.dataset.en===undefined) el.dataset.en=el.innerHTML;
      el.innerHTML=(l==='ar')?el.dataset.ar:el.dataset.en;
    }
    root.lang=l; root.dir=(l==='ar')?'rtl':'ltr';
    label.textContent=(l==='ar')?'English':'عربي';
    document.title=(l==='ar')
      ?'آلاء شاهين — متخصصة تصميم تجارب ومدرِّبة ومتحدثة'
      :'Alaa Shahin — Experience Design Specialist, Educator, Speaker';
  }
  function current(){ try{ return localStorage.getItem('as-lang')||'en'; }catch(e){ return 'en'; } }
  btn.addEventListener('click',function(){
    var next=current()==='ar'?'en':'ar';
    try{ localStorage.setItem('as-lang',next); }catch(e){}
    body.classList.add('is-swapping');
    setTimeout(function(){ apply(next); body.classList.remove('is-swapping'); },160);
  });
  apply(current());
})();
</script>
</body>
